services:
  logger.channel.simple_voting:
    parent: logger.channel_base
    arguments:
      - simple_voting

  simple_voting.manager:
    class: Drupal\simple_voting\VotingManager
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@database'
      - '@flood'
      - '@cache.default'
      - '@cache_tags.invalidator'
      - '@logger.channel.simple_voting'
